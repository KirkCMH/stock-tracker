name: Financial Data Sync

on:
  schedule:
    # 02:00 CST weekdays (UTC+8 → UTC 18:00 previous day)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync API
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_APP_URL }}/api/sync" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json")

          BODY=$(cat /tmp/body.json)
          echo "HTTP Status: $STATUS"
          echo "Response: $BODY"

          if [ "$STATUS" != "200" ]; then
            echo "Sync failed with HTTP $STATUS"

            # Discord notification
            if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
              curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
                -H "Content-Type: application/json" \
                -d "{\"content\":\"⚠️ **[TW50 Sync] 同步失敗**\\nHTTP Status: $STATUS\\nResponse: $BODY\"}"
            fi

            # Telegram notification
            if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                -d "text=⚠️ [TW50 Sync] 同步失敗 HTTP $STATUS"
            fi

            exit 1
          fi

          echo "Sync completed successfully"
